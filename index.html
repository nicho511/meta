<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Meta 廣告入門・三週互動課程</title>
    <style>
        :root {
            --bg: #f3f5f9;
            --card: #fff;
            --text: #1c1e21;
            --muted: #65676b;
            --brand: #0866ff;
            --soft: #e7f0ff;
            --line: #e4e6eb;
            --ok: #1a7f4b;
            --okb: #e3f6ec;
            --bad: #c0392b;
            --badb: #fdeceb;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #111214;
                --card: #1c1e22;
                --text: #e8eaed;
                --muted: #9aa0a6;
                --brand: #6ea8ff;
                --soft: #1c2a44;
                --line: #2c2f35;
                --ok: #5fd394;
                --okb: #15301f;
                --bad: #ff8a7a;
                --badb: #3a1c19
            }
        }

        :root[data-theme="dark"] {
            --bg: #111214;
            --card: #1c1e22;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --brand: #6ea8ff;
            --soft: #1c2a44;
            --line: #2c2f35;
            --ok: #5fd394;
            --okb: #15301f;
            --bad: #ff8a7a;
            --badb: #3a1c19
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.7
        }

        nav {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            background: var(--card);
            border-bottom: 1px solid var(--line);
            z-index: 5;
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            justify-content: safe center;
            overflow-x: auto
        }

        nav button {
            white-space: nowrap;
            border: 0;
            background: none;
            color: var(--muted);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 15px;
            cursor: pointer;
            font-family: inherit
        }

        nav button.on {
            background: var(--soft);
            color: var(--brand);
            font-weight: 600
        }

        main {
            max-width: 780px;
            margin: 0 auto;
            padding: 20px 16px 64px
        }

        h1 {
            font-size: 26px;
            margin: 16px 0 4px
        }

        h3 {
            margin: 0 0 2px;
            font-size: 18px
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 16px
        }

        .tag {
            display: inline-block;
            background: var(--soft);
            color: var(--brand);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 999px;
            margin-bottom: 6px
        }

        button {
            font-family: inherit
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px
        }

        .term,
        .opt {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            transition: .15s
        }

        .term:hover,
        .opt:hover {
            border-color: var(--brand)
        }

        .term .d {
            display: none;
            color: var(--muted);
            font-size: 13px;
            margin-top: 6px
        }

        .term.open {
            background: var(--soft);
            border-color: var(--brand)
        }

        .term.open .d {
            display: block
        }

        .opt.sel {
            border-color: var(--brand);
            background: var(--soft);
            box-shadow: 0 0 0 1px var(--brand)
        }

        .opt small {
            display: block;
            color: var(--muted);
            font-size: 12px
        }

        .opt.ok {
            background: var(--okb);
            border-color: var(--ok)
        }

        .opt.bad {
            background: var(--badb);
            border-color: var(--bad)
        }

        .layers {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px
        }

        .layers .opt:nth-child(2) {
            margin-left: 16px
        }

        .layers .opt:nth-child(3) {
            margin-left: 32px
        }

        .panel {
            background: var(--soft);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 15px
        }

        .panel ul {
            margin: 6px 0;
            padding-left: 20px
        }

        .mock {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            font-size: 13px
        }

        .mtabs {
            display: flex;
            background: var(--bg);
            border-bottom: 1px solid var(--line)
        }

        .mtabs button {
            flex: 1;
            border: 0;
            background: none;
            padding: 10px 4px;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-size: 13px
        }

        .mtabs button.on {
            color: var(--brand);
            border-color: var(--brand);
            background: var(--card);
            font-weight: 600
        }

        .tool {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 8px
        }

        .tool button {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px
        }

        .tool button.pri {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand)
        }

        .tw {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 480px
        }

        th,
        td {
            padding: 8px 10px;
            text-align: left;
            border-top: 1px solid var(--line);
            white-space: nowrap
        }

        th {
            color: var(--muted);
            font-weight: 600;
            cursor: pointer;
            background: var(--bg)
        }

        th:hover {
            color: var(--brand)
        }

        tbody tr {
            cursor: pointer
        }

        tbody tr:hover {
            background: var(--soft)
        }

        .hint {
            margin: 10px 8px 8px;
            min-height: 44px
        }

        .row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px
        }

        @media(min-width:680px) {
            .row {
                grid-template-columns: 1fr 280px
            }
        }

        .ad {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
            font-size: 14px;
            align-self: start
        }

        .adh {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px
        }

        .av {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--brand);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700
        }

        .adh small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.2
        }

        .ad p {
            margin: 0 10px 8px
        }

        .adimg {
            height: 150px;
            background: linear-gradient(135deg, #9ec5ff, #c9b6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px
        }

        .adf {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg);
            gap: 8px
        }

        .cta {
            background: var(--line);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap
        }

        .steps {
            display: flex;
            gap: 6px;
            margin-bottom: 12px
        }

        .steps i {
            flex: 1;
            height: 5px;
            border-radius: 5px;
            background: var(--line)
        }

        .steps i.on {
            background: var(--brand)
        }

        .nb {
            display: flex;
            justify-content: space-between;
            margin-top: 14px
        }

        .btn {
            border: 0;
            background: var(--brand);
            color: #fff;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px
        }

        .btn.g {
            background: var(--line);
            color: var(--text)
        }

        .btn:disabled {
            opacity: .4;
            cursor: default
        }

        input[type=text],
        select {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font-size: 15px;
            margin: 6px 0 10px;
            font-family: inherit
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--brand)
        }

        .q {
            margin-bottom: 16px
        }

        .q b {
            display: block;
            margin-bottom: 8px
        }

        .why {
            display: none;
            font-size: 13px;
            color: var(--muted);
            margin-top: 6px
        }

        .opts {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .score {
            font-weight: 600;
            color: var(--brand)
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0
        }

        .chip {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 14px;
            cursor: pointer;
            background: var(--card);
            color: var(--text);
            font-size: 14px
        }

        .chip.used {
            opacity: .35;
            pointer-events: none
        }

        .slot {
            padding: 8px 12px;
            border: 1px dashed var(--line);
            border-radius: 10px;
            margin: 4px 0;
            min-height: 38px;
            font-size: 14px
        }

        .slot.f {
            border-style: solid;
            border-color: var(--ok);
            background: var(--okb)
        }

        .calc {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 12px
        }

        .calc label {
            font-size: 13px;
            color: var(--muted)
        }

        .res {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 6px
        }

        .res div {
            background: var(--soft);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--muted)
        }

        .res b {
            display: block;
            font-size: 20px;
            color: var(--brand)
        }

        details.fold>summary {
            cursor: pointer;
            font-weight: 600;
            padding: 2px 0
        }

        details.fold[open]>summary {
            margin-bottom: 6px
        }

        .fold .card {
            margin-top: 12px;
            box-shadow: none
        }

        .row2 {
            display: grid;
            gap: 14px
        }

        @media(min-width:680px) {
            .row2 {
                grid-template-columns: 300px 1fr
            }
        }

        .hs {
            position: relative;
            cursor: pointer;
            border-radius: 6px
        }

        .hs.on2 {
            outline: 2px solid var(--brand);
            outline-offset: -2px
        }

        .bd {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--brand);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none
        }

        .ph {
            background: #111;
            border-radius: 26px;
            padding: 8px;
            width: 230px;
            max-width: 100%;
            margin: 0 auto
        }

        .phi {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            background: var(--card);
            color: var(--text);
            font-size: 12px;
            line-height: 1.5
        }

        .safe {
            position: absolute;
            border: 1px dashed #ff5a5a;
            background: rgba(255, 90, 90, .2);
            color: #fff;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none
        }
    </style>
</head>

<body>
    <nav id="nav"></nav>
    <main id="app"></main>
    <script>

        /* 建立廣告精靈 */
